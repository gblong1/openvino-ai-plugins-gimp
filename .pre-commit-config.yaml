# Pre-commit hooks configuration for GIMP OpenVINO AI Plugins
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# To install: pre-commit install
# To run manually: pre-commit run --all-files

# Use the system's default Python (3.10+)
default_language_version:
  python: python3

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(.*\.md|.*\.txt)$
      - id: end-of-file-fixer
        exclude: ^(weights/|thirdparty/)
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-docstring-first
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]

  # Ruff - Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^(weights/|thirdparty/)
      # Run the formatter
      - id: ruff-format
        exclude: ^(weights/|thirdparty/)

  # isort - Import sorting (backup to ruff's import sorting)
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (python)
        args: [--profile=black, --line-length=88]
        exclude: ^(weights/|thirdparty/)

  # mypy - Type checking (optional, disabled by default due to incomplete type coverage)
  # Uncomment the hook below to enable type checking
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.8.0
  #   hooks:
  #     - id: mypy
  #       args: [--config-file=pyproject.toml, --ignore-missing-imports]
  #       exclude: ^(tests/|weights/|thirdparty/|setup\.py|model_setup\.py)

  # black - Code formatter (backup to ruff format)
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        args: [--line-length=88]
        exclude: ^(weights/|thirdparty/)
