[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# Project metadata is fully managed in setup.py for backwards compatibility
# This file serves as the central configuration for development tools only

[tool.pytest.ini_options]
# Pytest configuration (migrated from pytest.ini)
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "smoke: Smoke tests for basic functionality",
    "integration: Integration tests for component interaction",
    "unit: Unit tests for individual components",
    "slow: Tests that take significant time to run",
    "socket: Tests involving socket communication",
    "model: Tests involving model loading and inference",
    "plugin: Tests involving GIMP plugin interfaces",
]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=gimpopenvino",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=0",
]

[tool.coverage.run]
source = ["gimpopenvino"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

# Ruff - Modern Python linter and formatter
[tool.ruff]
# Target Python 3.10+ (minimum version for this project)
target-version = "py310"

# Line length to match black's default
line-length = 88

# Exclude common directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "htmlcov",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "weights",
    "thirdparty",
]

[tool.ruff.lint]
# Enable select rule sets - starting with safe defaults
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
]

# Rules to ignore for gradual adoption on existing codebase
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module level import not at top of file (common in GIMP plugins due to gi.require_version)
    "E701",   # multiple statements on one line (will be fixed gradually)
    "E711",   # comparison to None (existing code style)
    "E722",   # bare except (existing code, should be fixed gradually)
    "W191",   # indentation contains tabs (will be fixed by formatter)
    "W291",   # trailing whitespace (will be fixed by formatter)
    "W293",   # blank line contains whitespace (will be fixed by formatter)
    "F401",   # imported but unused (will be cleaned up gradually)
    "F821",   # undefined name (needs careful review)
    "F841",   # local variable assigned but never used (will be cleaned up gradually)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Ignore certain rules in test files
"tests/**/*.py" = [
    "S101",  # allow assert statements in tests
    "B007",  # unused loop variable (common in tests)
    "SIM117",  # nested with statements (acceptable in tests)
]
"test_*.py" = [
    "S101",  # allow assert statements in tests
    "B007",  # unused loop variable (common in tests)
]
# Ignore naming convention errors in specific files
"gimpopenvino/plugins/openvino_utils/plugin_utils.py" = [
    "N802",  # N_ is a common i18n pattern
]
"gimpopenvino/plugins/superresolution_ov/superresolution_ov.py" = [
    "N802",  # N_ is a common i18n pattern
]
# Ignore certain errors in model files (complex ML code)
"gimpopenvino/plugins/openvino_utils/tools/openvino_common/models_ov/**/*.py" = [
    "B006",  # mutable default arguments (common in ML frameworks)
    "B023",  # function definition does not bind loop variable
    "B904",  # raise without from inside except
    "B905",  # zip without strict parameter (Python 3.10+ feature)
    "C416",  # unnecessary dict comprehension
    "C419",  # unnecessary list comprehension
    "N801",  # class naming convention (ML models)
    "N802",  # function naming convention (ML models)
    "N806",  # variable naming convention (ML constants)
    "SIM101", # multiple isinstance calls
    "SIM102", # nested if statements (acceptable in complex logic)
    "SIM103", # return condition directly
    "SIM110", # use any() instead of for loop
    "SIM201", # use != instead of not ==
    "SIM210", # use bool() instead of ternary
]
# Ignore issues in install/setup files
"gimpopenvino/install_utils.py" = [
    "N806",  # variable naming convention (UUID constants)
    "SIM102", # nested if statements (acceptable in setup code)
]
"setup.py" = [
    "W291",  # trailing whitespace in docstrings
    "W293",  # blank line contains whitespace in docstrings
]
# Ignore issues in plugin files
"gimpopenvino/plugins/**/*_ov.py" = [
    "SIM102", # nested if statements (GUI code often has nested conditions)
    "SIM103", # return condition directly
    "SIM113", # use enumerate
]
# Ignore issues in model manager (complex download/install logic)
"gimpopenvino/plugins/openvino_utils/tools/model_manager.py" = [
    "B023",  # function definition does not bind loop variable
    "SIM102", # nested if statements
    "SIM103", # return condition directly
    "SIM110", # use any() instead of for loop
]
# Ignore issues in testcases
"testcases/**/*.py" = [
    "SIM118", # use key in dict instead of key in dict.keys()
]
# Ignore complex code issues in adapters
"gimpopenvino/plugins/openvino_utils/tools/openvino_common/adapters/**/*.py" = [
    "B006",  # mutable default arguments
    "SIM102", # nested if statements
    "SIM118", # use key in dict
]
# Ignore pipeline complexity
"gimpopenvino/plugins/openvino_utils/tools/openvino_common/pipelines/**/*.py" = [
    "B006",  # mutable default arguments (ML pipeline pattern)
]
# Ignore FastSD backend complexity
"gimpopenvino/plugins/openvino_utils/tools/openvino_common/models_ov/fastsd/**/*.py" = [
    "B006",  # mutable default arguments
    "N801",  # class naming convention
    "SIM68",  # context manager issues
    "SIM102", # nested if statements
    "SIM103", # return condition directly
]
# Ignore server file issues
"gimpopenvino/plugins/openvino_utils/tools/stable_diffusion_ov_server.py" = [
    "W191",  # tabs in indentation (existing code)
]
# Ignore tools utils complexity
"gimpopenvino/plugins/openvino_utils/tools/tools_utils.py" = [
    "C408",  # unnecessary dict() call (existing code style)
]

[tool.ruff.lint.isort]
# Make isort compatible with black
force-single-line = false
force-wrap-aliases = false
split-on-trailing-comma = true
known-first-party = ["gimpopenvino"]

[tool.ruff.format]
# Use double quotes for strings (black default)
quote-style = "double"

# Use spaces for indentation
indent-style = "space"

# Respect magic trailing comma
skip-magic-trailing-comma = false

# Auto-detect line ending
line-ending = "auto"

# isort - Import sorting (works alongside ruff)
[tool.isort]
# Use black-compatible profile
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["gimpopenvino"]
skip_glob = [
    "*.egg-info",
    "build",
    "dist",
    ".venv",
    "venv",
    "__pycache__",
    "weights",
    "thirdparty",
]

# mypy - Type checking
[tool.mypy]
# Start with gradual typing - loose settings to avoid overwhelming errors
python_version = "3.10"

# Import discovery
files = ["gimpopenvino", "tests"]
exclude = [
    "build",
    "dist",
    "weights",
    "thirdparty",
]

# Type checking behavior
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

# Strictness options (gradually enable these)
warn_return_any = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false

# Error messages
show_error_codes = true
show_column_numbers = true
pretty = true

# Platform configuration
platform = "linux"

# Allow untyped libraries
ignore_missing_imports = true

# black - Code formatter (for backwards compatibility)
[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
  | build
  | dist
  | \.egg-info
  | weights
  | thirdparty
)/
'''
